# ============================================================
# Notes
# ============================================================
# Purpose:
#   Refined no-reroute scoring sweep after the first edge-habit test.
#   This tests initial route choice only; dynamic rerouting is disabled.
#
#
# Main target metric:
#   meanBestJaccard
#
# Why this grid:
#   Previous top-10% analysis suggested:
#     - betaEdgeHabit > 0 is better than betaEdgeHabit = 0.
#     - betaDetour works best around moderate values, especially near 0.25.
#     - betaComplexity should stay low; high values such as 0.5, 0.75, and 1.0 hurt.
#     - betaMemory is weak but may help slightly at small values.
#
# Interpretation of fixed values:
#   betaTimeGrid=1.0:
#     Travel time is the reference weight because normalizeChoiceUtility=true.
#
#   betaPriorGrid=0.0:
#     Prior share is disabled because candidate routes are graph-generated,
#     not empirical behavioral route alternatives.
#
#   betaHabitGrid=0.0 and habitMode=off:
#     Old route-level habit is disabled so the experiment isolates edge-level habit.
#
#   edgeHabitMode=collective:
#     All taxis share one global edge-use habit table.
#     This allows learned road-segment familiarity to transfer across OD pairs.
#
#   edgeHabitScale=10.0:
#     Edge habit is computed using:
#       edgeHabitScore = average(log1p(edgeUseCount / edgeHabitScale))
#     Larger scale values make edge habit build more slowly.
#
#   decisionNoiseStdGrid=0.0:
#     Deterministic scoring, easier to interpret.
#
#   maxReroutesGrid=0:
#     No dynamic rerouting. This is the clean scoring-only ablation.
#
#   slowdown/reroute thresholds are set extremely high:
#     This prevents rerouting from triggering accidentally if maxReroutesGrid
#     is changed later without updating the thresholds.
#
# Suggested command:
#   java -cp out porto.sweep.app.RunSweepMain --config=examples/porto/edge_habit_scoring_no_reroute_refined.properties
#
# Suggested analysis features:
#   feature_cols = [
#       "betaMemory",
#       "betaEdgeHabit",
#       "betaDetour",
#       "betaComplexity",
#   ]
# ============================================================